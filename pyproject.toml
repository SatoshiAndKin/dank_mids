[build-system]
requires = ["hatchling>=1.27", "tomli>=2; python_version < '3.11'"]
build-backend = "hatchling.build"

[project]
name = "dank-mids"
version = "4.20.215"
description = "Multicall batching middleware for asynchronous scripts using web3.py"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [
    { name = "BobTheBuidler", email = "bobthebuidlerdefi@gmail.com" },
]
dependencies = [
    "aiofiles",
    "aiolimiter>=1.2,<1.3",
    "cchecksum @ git+https://github.com/SatoshiAndKin/cchecksum.git@fff7e1fe87f4679ec96de1cebb1cdd8f5e94be44",
    "eth-retry>=0.3.6,<1",
    "eth-typing>=4.2.0",
    "evmspec @ git+https://github.com/SatoshiAndKin/evmspec.git@31c8540a14228ca49c77c19d565a6aaee3d0079f",
    "ez-a-sync>=0.34.0,<0.35",
    "faster-eth-abi>=5.2.12",
    "faster-eth-utils>=5.3.11",
    "faster-hexbytes>1,<2",
    "librt>=0.11,<1",
    "multicall>=0.6.2,<1",
    "typed-envs==0.2.4",
    "web3>=7,<8",
]

[project.urls]
Homepage = "https://github.com/BobTheBuidler/dank_mids"
Repository = "https://github.com/BobTheBuidler/dank_mids"
Documentation = "https://BobTheBuidler.github.io/dank_mids"

[dependency-groups]
build = [
    "eth-retry==0.3.7",
    "eth-typing==5.2.1",
    "ez-a-sync==0.34.2",
    "faster-eth-abi==5.2.30",
    "faster-hexbytes==1.3.8",
    "mypy[mypyc]==2.2.0",
    "setuptools",
    "typed-envs==0.2.4",
    "tomli>=2; python_version < '3.11'",
    "types-requests",
]
dev = [
    "eth-brownie==1.22.2",
    "importlib-resources>=6.4.0",
    "pytest==9.1.1",
    "pytest-asyncio-cooperative==0.40.0",
    "pytest-cov==6.3.0",
    "pytest-sugar==1.1.1",
    "setuptools<81",
    "types-aiofiles==25.1.0.20251011",
]
docs = [
    { include-group = "dev" },
    "Cython<4",
    "sphinx",
    "sphinx-rtd-theme",
    "wheel",
]
mypy = [
    { include-group = "build" },
    "types-aiofiles==25.1.0.20251011",
]

[tool.uv]
required-version = ">=0.11.0"
default-groups = ["dev"]

[tool.hatch.build]
exclude = [
    "/*.pyd",
    "/*.so",
    "/build",
    "/cache",
    "/dist",
    "/docs/_build",
    "/env",
    "/tests",
    "/.github",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.tox",
    "/.venv",
    "dank_mids/_vendor/aiolimiter/.git",
    "dank_mids/_vendor/aiolimiter/.github",
    "dank_mids/_vendor/aiolimiter/docs",
    "dank_mids/_vendor/aiolimiter/tests",
    "dank_mids/**/*.pyd",
    "dank_mids/**/*.so",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "dank_mids",
    "hatch_build.py",
    "LICENSE",
    "README.md",
    "scripts",
]

[tool.hatch.build.targets.wheel]
packages = ["dank_mids"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.mypy]
exclude = ["build/", "cache/", "env/", "tests/"]
ignore_missing_imports = true
check_untyped_defs = true
incremental = false
disable_error_code = ["return", "unused-ignore", "arg-type", "assignment", "attr-defined", "call-arg", "empty-body", "index", "import-untyped", "misc", "name-defined", "no-redef", "operator", "override", "return-value", "type-arg", "type-var", "typeddict-item", "union-attr", "valid-type", "var-annotated"]
plugins = ["typed_envs.mypy_plugin", "a_sync_mypy_plugin"]
files = ["dank_mids"]
pretty = true
show_error_codes = true
show_error_context = true
show_traceback = true
warn_no_return = false

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | cache
  | docs
  | dist
  | env
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/compiled_imports"]
addopts = "--disable-plugin-autoload"

[tool.dank-mids.mypyc]
targets = ["dank_mids/_batch.py", "dank_mids/_demo_mode.py", "dank_mids/_envs.py", "dank_mids/_eth_utils.py", "dank_mids/_exceptions.py", "dank_mids/_tasks.py", "dank_mids/_uid.py", "dank_mids/_vendor/aiolimiter/src", "dank_mids/_web3/abi.py", "dank_mids/_web3/formatters.py", "dank_mids/brownie_patch/__init__.py", "dank_mids/brownie_patch/_abi.py", "dank_mids/brownie_patch/call.py", "dank_mids/brownie_patch/overloaded.py", "dank_mids/brownie_patch/types.py", "dank_mids/constants.py", "dank_mids/controller.py", "dank_mids/ENVIRONMENT_VARIABLES.py", "dank_mids/helpers/__init__.py", "dank_mids/helpers/_controllers.py", "dank_mids/helpers/_codec.py", "dank_mids/helpers/_errors.py", "dank_mids/helpers/_gather.py", "dank_mids/helpers/_rate_limit.py", "dank_mids/helpers/_retry_mechanics.py", "dank_mids/helpers/_requester.py", "dank_mids/helpers/_weaklist.py", "dank_mids/helpers/batch_size.py", "dank_mids/helpers/hashing.py", "dank_mids/helpers/lru_cache.py", "dank_mids/helpers/method.py", "dank_mids/lock.py", "dank_mids/logging.py", "dank_mids/middleware.py", "dank_mids/stats/_float_moving_average.py", "dank_mids/stats/__init__.py"]

[tool.hatch.metadata]
allow-direct-references = true
