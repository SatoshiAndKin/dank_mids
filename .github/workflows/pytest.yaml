name: PyTest

on:
  pull_request:
    branches: [master, good-master]
    paths:
      - '.github/actions/setup-python-cache/action.yml'
      - '**.py'
      - '**.so'
      - '**/pytest.ini'
      - '**/pytest.yaml'
      - 'poetry.lock'
      - 'pyproject.toml'
      - 'requirements-build.txt'
  workflow_dispatch:
      
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        pyversion: [ "3.10", "3.11", "3.12", "3.13" ]
        include:
        - os: ubuntu-latest
          path: ~/.cache/pip
        - os: macos-latest
          path: ~/Library/Caches/pip
        - os: windows-latest
          path: ~\AppData\Local\pip\Cache

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python (faster than using Python container)
        uses: ./.github/actions/setup-python-cache
        with:
          python-version: ${{ matrix.pyversion }}
          cache-dependency-path: |
              requirements-build.txt
              pyproject.toml
              poetry.lock

      - name: Load native extensions for this source
        id: native-extensions
        uses: actions/cache@v5
        with:
          path: |
            dank_mids/**/*.so
            dank_mids/**/*.pyd
            *__mypyc*.so
            *__mypyc*.pyd
          key: unit-native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.pyversion }}-${{ hashFiles('dank_mids/**/*.py', 'pyproject.toml', 'requirements-build.txt', 'scripts/run_mypyc_build.py') }}

      - name: Build checkout native extensions
        if: steps.native-extensions.outputs.cache-hit != 'true'
        run: python scripts/run_mypyc_build.py
        shell: bash

      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v5
        with:
          path: ~/.local  # the path depends on the OS
          key: poetry-${{ runner.os }}-${{ matrix.pyversion }}-0  # increment to reset cache

      - name: Configure Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.pyversion }}-${{ hashFiles('**/poetry.lock') }}-1  # increment to reset cache

      - name: Install Dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction
        shell: bash

      - name: Run unit tests
        working-directory: tests/unit
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
        run: poetry run pytest
        shell: bash
