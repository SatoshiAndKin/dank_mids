name: Weekly upstream Renovate

on:
  schedule:
    - cron: "15 17 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: Open update pull requests
        type: boolean
        default: false

permissions: {}

concurrency:
  group: renovate-upstream

jobs:
  renovate:
    if: github.repository == 'SatoshiAndKin/dank_mids'
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: SatoshiAndKin/dank_mids/.github/workflows/renovate-upstream-reviewed-linux.yml@1144ede950757219cde37fb4fe8ec32a90047610
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && !inputs.apply }}
