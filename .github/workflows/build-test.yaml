name: Build And Test
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.paths.outputs.run_validation }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: ${{ github.token }}
        CI_INCLUDE_PATHS: '[".github/actions/setup-python-cache/action.yml",".github/workflows/build-test.yaml","**/pytest.ini","**/pytest.yaml",".gitmodules","Makefile","hatch_build.py","pyproject.toml","tests/**","scripts/check_mypyc_wheel.py","scripts/ci/build_source_extensions.py","scripts/ci/mypyc_targets.py","scripts/run_mypyc_build.py","uv.lock","dank_mids/**/*.py","dank_mids/_vendor/aiolimiter","dank_mids/_vendor/aiolimiter/**"]'
        CI_IGNORE_PATHS: '[]'
      run: python3 .github/scripts/ci_changes.py
  generated-c:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref || github.ref }}
        fetch-depth: 0
        submodules: recursive
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        enable-cache: true
    - name: Install build dependencies
      run: uv sync --only-group build
    - name: Run Mypyc
      run: uv run --no-sync python scripts/run_mypyc_build.py
    - name: Normalize C files for diffchecking
      shell: bash
      run: "for f in build/*.c; do\n  if ! grep -q 'DIFFCHECK_PLACEHOLDER' \"$f\"; then\n    sed -i '1i#ifndef DIFFCHECK_PLACEHOLDER\\n#define DIFFCHECK_PLACEHOLDER 0\\n#endif' \"$f\"\n  fi\ndone\nsed -i 's/\\(CPy_AddTraceback([^,]*, *[^,]*, *\\)[0-9]\\+\\(, *[^)]*)\\)/\\1DIFFCHECK_PLACEHOLDER\\2/g' build/*.c\nsed -i 's/CPyStatics\\[[0-9]\\+\\]/CPyStatics[DIFFCHECK_PLACEHOLDER]/g' build/*.c\n"
    - name: Check for generated C changes
      shell: bash
      run: "if [[ -n $(git status --porcelain -- build) ]]; then\n  echo \"changes_detected=true\" >> \"$GITHUB_ENV\"\nelse\n  echo \"changes_detected=false\" >> \"$GITHUB_ENV\"\nfi\n"
    - name: Commit generated C changes
      if: env.changes_detected == 'true' && github.actor != 'github-actions[bot]'
      shell: bash
      run: 'git config --local user.name "github-actions[bot]"

        git config --local user.email "github-actions[bot]@users.noreply.github.com"

        git pull

        git add build

        git commit -m "chore: compile to C for Linux x64 with mypyc"

        git push

        '
    needs:
    - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  native-extensions:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        pyversion:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: recursive
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.pyversion }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        enable-cache: true
    - name: Install build dependencies
      run: uv sync --only-group build
      shell: bash
    - name: Cache source-tree extensions
      id: native-cache
      uses: actions/cache@v5
      with:
        path: compiled-artifacts
        key: native-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.pyversion }}-${{ hashFiles('dank_mids/**/*.py', 'uv.lock', 'pyproject.toml', 'scripts/ci/*.py', 'scripts/run_mypyc_build.py', '.gitmodules') }}
    - name: Build source-tree extensions
      if: steps.native-cache.outputs.cache-hit != 'true'
      run: uv run --no-sync python scripts/ci/build_source_extensions.py --artifact-dir compiled-artifacts
      shell: bash
    - name: Upload source-tree extensions
      uses: actions/upload-artifact@v6
      with:
        name: compiled-${{ matrix.os }}-py${{ matrix.pyversion }}
        path: compiled-artifacts
        if-no-files-found: error
    needs:
    - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  unit:
    needs:
    - native-extensions
    - ci_changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        pyversion:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        submodules: recursive
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.pyversion }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --group dev --no-install-project
      shell: bash
    - name: Download source-tree extensions
      uses: actions/download-artifact@v7
      with:
        name: compiled-${{ matrix.os }}-py${{ matrix.pyversion }}
        path: .
    - name: Run unit tests and audit compiled imports
      env:
        DANK_MIDS_COMPILED_IMPORT_LOCATION: source-tree
        PYTHONFAULTHANDLER: 1
        PYTHONMALLOC: debug
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
        TYPEDENVS_SHUTUP: 1
      run: uv run --no-sync python -m pytest
      shell: bash
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  ci_gate:
    name: CI (build-test.yaml)
    if: ${{ !cancelled() }}
    needs:
    - ci_changes
    - generated-c
    - native-extensions
    - unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: ${{ toJSON(needs) }}
        CI_EXPECTED_JOBS: '["generated-c","native-extensions","unit"]'
      run: 'python3 -m unittest discover -s .github/scripts -p test_ci_contract.py

        python3 .github/scripts/ci_gate.py'
'on':
  pull_request:
    branches:
    - master
    - good-master
    paths:
    - '**'
  workflow_dispatch: null
