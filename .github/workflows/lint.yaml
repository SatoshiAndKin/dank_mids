name: Lint All The Things
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.paths.outputs.run_validation }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: ${{ github.token }}
        CI_INCLUDE_PATHS: '[]'
        CI_IGNORE_PATHS: '[".github/workflows/**","!.github/workflows/lint.yaml"]'
      run: python3 .github/scripts/ci_changes.py
  lint-all-the-things:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref }}
    - name: Lint All The Things
      uses: BobTheBuidler/lint-all-the-things@v0.3.0
      with:
        python-version: 3.14
        pyupgrade-target-version: py310
    needs:
    - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  ci_gate:
    name: CI (lint.yaml)
    if: ${{ !cancelled() }}
    needs:
    - ci_changes
    - lint-all-the-things
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: ${{ toJSON(needs) }}
        CI_EXPECTED_JOBS: '["lint-all-the-things"]'
      run: 'python3 -m unittest discover -s .github/scripts -p test_ci_contract.py

        python3 .github/scripts/ci_gate.py'
'on':
  pull_request:
    branches:
    - master
    paths:
    - '**'
