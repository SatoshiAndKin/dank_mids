name: Upload Python Package
concurrency:
  group: pr-ci-release.yaml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.paths.outputs.run_validation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          CI_INCLUDE_PATHS: '["dank_mids/**","pyproject.toml","uv.lock","hatch_build.py","scripts/**","tests/compiled_imports/**",".github/workflows/release.yaml"]'
          CI_IGNORE_PATHS: "[]"
        run: python3 .github/scripts/ci_changes.py
  sdist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Build sdist
        run: uv build --sdist --out-dir dist
      - name: Verify sdist excludes generated binaries
        shell: bash
        run: "python - <<'PY'\nimport tarfile\nfrom pathlib import Path\n\nsdist, = Path(\"dist\").glob(\"*.tar.gz\")\nwith tarfile.open(sdist) as tf:\n    names = tf.getnames()\ngenerated = [\n    name\n    for name in names\n    if (\n        name.endswith((\".so\", \".pyd\", \"/.git\"))\n        or \"/build/\" in name\n        or \"/.git/\" in name\n    )\n]\nif generated:\n    raise SystemExit(\"sdist includes generated artifacts:\\n\" + \"\\n\".join(generated))\nPY\n"
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/*.tar.gz
    needs:
      - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  ci_gate:
    name: CI (release.yaml)
    if: ${{ !cancelled() }}
    needs:
      - ci_changes
      - sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify validation contract
        env:
          CI_GATE_NEEDS: ${{ toJSON(needs) }}
          CI_EXPECTED_JOBS: '["sdist"]'
        run:
          "python3 -m unittest discover -s .github/scripts -p test_ci_contract.py

          python3 .github/scripts/ci_gate.py"
  wheels:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_SKIP: pp* *-musllinux_* *-win32
          CIBW_TEST_COMMAND: python -c "import os, pytest; os.chdir(r'{project}/tests/compiled_imports'); raise SystemExit(pytest.main())"
          CIBW_TEST_ENVIRONMENT:
            "DANK_MIDS_COMPILED_IMPORT_LOCATION=installed-wheel PYTHONFAULTHANDLER=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 TYPEDENVS_SHUTUP=1

            "
          CIBW_TEST_REQUIRES: pytest eth-brownie==1.22.2
        with:
          output-dir: wheelhouse
      - name: Verify compiled wheel targets
        shell: bash
        run: uv run --only-group build python scripts/check_mypyc_wheel.py wheelhouse/*.whl
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
  publish:
    if: github.event_name == 'release'
    needs:
      - sdist
      - wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_PASSWORD }}
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - sdist
      - wheels
    runs-on: ubuntu-latest
    steps:
      - name: Skip publish on workflow_dispatch
        run: 'echo "workflow_dispatch: built distributions without publishing."

          '
"on":
  release:
    types:
      - published
  pull_request:
    branches:
      - master
    paths:
      - "**"
  workflow_dispatch: null
